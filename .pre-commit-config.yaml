# Install once: pre-commit install --install-hooks (bootstrap.sh does this)
# Run manually: pre-commit run --all-files
#
# `rev: ` pins are updated deliberately with `pre-commit autoupdate` to avoid having formatting rules change that rewrites

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        # Avoids commiting large snapshots
        args: [--maxkb=512]
